# Packages allowed to run install scripts (native modules). Two spellings so any pnpm version on the host builds them:
# "allowBuilds" (newer pnpm) and "onlyBuiltDependencies" (pnpm 10).
allowBuilds:
  better-sqlite3: true
  sharp: true
  esbuild: true
onlyBuiltDependencies:
  - better-sqlite3
  - sharp
  - esbuild
